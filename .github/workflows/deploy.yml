name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Deploys run one at a time, in push order; a running deploy is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the "production" environment, restricted to the main branch.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations first: new code may rely on new columns. Applied migrations are skipped.
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
